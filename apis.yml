name: TourHero
description: TourHero is a social travel platform and end-to-end group trip operations
  partner that lets creators, coaches, and community leaders host fully customized
  group trips in 50+ countries, with itinerary design, vetted local operators, payments,
  and on-the-ground logistics handled by TourHero. Travelers can browse and book
  public trips on its Explore page, and hosts plan for free while TourHero earns
  commission from local suppliers. Backed by 500 Global and Lightspeed Venture
  Partners, it is a consumer platform with no publicly documented developer API
  surface at this time, though it publishes an llms.txt profile for AI agents.
